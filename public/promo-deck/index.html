<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silicon PC — Deck promocional</title>

    <!--
      Bundles copiados de node_modules/hyperframes/dist — registran
      <hyperframes-player> y <hyperframes-slideshow> como custom elements.
      Self-contained: funciona sin conexión a internet ni CLI corriendo.
    -->
    <script src="vendor/hyperframes-player.global.js"></script>
    <script src="vendor/hyperframes-slideshow.global.js"></script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070a;
      }
    </style>
  </head>
  <body>
    <!-- tabindex="0" es necesario para que las flechas del teclado funcionen -->
    <hyperframes-slideshow
      tabindex="0"
      style="display: block; position: relative; width: 100vw; height: 100vh"
    >
      <hyperframes-player
        interactive
        style="position: absolute; inset: 0"
        src="composition/index.html"
      ></hyperframes-player>

      <!--
        Isla duplicada — <hyperframes-slideshow> la lee de su propio innerHTML,
        no de la composición. Mantener sincronizada con composition/index.html.
      -->
      <script type="application/hyperframes-slideshow+json">
        {
          "slides": [
            { "sceneId": "problem", "notes": "Abrir con el dolor, no con la marca." },
            { "sceneId": "turn", "notes": "Silencio de un fotograma antes del reveal del logo." },
            { "sceneId": "solution", "notes": "Mostrar la landing real. Disponible 24/7." },
            { "sceneId": "features", "notes": "Catálogo, taller técnico, +15 años, mobile-first." },
            { "sceneId": "comparison", "notes": "El argumento de cierre para el cliente empresarial." },
            { "sceneId": "cta", "notes": "Cierre con el logo y la URL real del sitio." }
          ],
          "slideSequences": []
        }
      </script>
    </hyperframes-slideshow>
    <!-- El capsule de navegación (Prev/Next/Present) lo renderiza el propio componente. -->
  </body>
</html>
